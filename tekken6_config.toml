# Netplay input point (our code, src/t6_netplay.h): in the entry builder (PS3 FUN_00186a10) after both 0x4C input
# entries are built (P1 at r1+80, P2 at r1+156) and before they go to the input manager (sub_823FAA08).
# Frame boundary for netplay save/load: head of the main loop sub_822198D8 (`while (running) sub_82218C80(root)`, the
# per-frame task tree step, PS3 FUN_00100250 / rb_frame_step). src/t6_netplay.cpp T6FrameHook.
[[midasm_hook]]
address = 0x82219900
name = "T6FrameHook"
registers = ["r3"]

[[midasm_hook]]
address = 0x82268A0C
name = "T6InputHook"
registers = ["r1"]

# srand of the game's main LCG (0x828B49E0; called indirectly): seed in r3. T6SeedHook logs it and, for replays and
# netplay, replaces it with a fixed / agreed seed (src/t6_netplay.cpp).
[[midasm_hook]]
address = 0x822658F0
name = "T6SeedHook"
registers = ["r3"]

# CRT srand (per-thread rand state at _getptd()+20), called once at boot as srand(time(NULL)) from sub_82254B88:
