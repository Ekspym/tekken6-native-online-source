# Retail descriptor dispatcher. The index is the low nibble of r7; entries
# 0 and 1 re-enter the descriptor resolver, 2-5 dispatch to helper functions,
# 6-13 are null targets, and 14-15 read the adjacent table entries exactly as
# the original indexed load does. Keeping this as an explicit table lets the
# emitter preserve self-tail dispatch as a local loop.
[[switch_tables]]
address = 0x8256D5E0
register = 7
selector_mask = 0xF
labels = [
  0x8256D5B8, 0x8256D5B8, 0x8256D3D0, 0x8256D3E8,
  0x8256D400, 0x8256D400, 0, 0, 0, 0, 0, 0, 0, 0,
  0x8256CBC8, 0x8256D418,
]

