# First-pass RexGlue codegen configuration for the retail Tekken 6 XEX.
# This intentionally carries only validated structural hints from the existing
# XenonRecomp pass. Runtime approximations, decoded-bank remaps, forced GPU
# readiness, and guessed callbacks are deliberately absent.

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Speed-ups from github mahmoud-mess/tekken6-recomp (2026-10-17): the guest CRT memcpy / memset run as the host's
# (SDK src/kernel/crt/memory.cpp REX_HOOK_RAW, guest addresses), and a callback loaded from a 20-byte record and
# dispatched through CTR is an indirect call (not a switch).
indirect_calls = [0x82390788]

[rexcrt]
memcpy = 0x826A1130
memset = 0x826A03B0

# RexGlue's validation reports these branch targets as tail/secondary
# functions, while the existing independent XenonRecomp pass already proves
# each is a real emitted function start in this exact XEX.
[functions]
# (mahmoud-mess) high-call-count vector state helpers, audited leaf routines: their non-volatile VMX registers are
# locals, written back at return (less PPCContext traffic, no localizing across calls)
"0x82513308" = { name = "sub_82513308", non_volatile_as_local = true }
"0x82513BC0" = { name = "sub_82513BC0", non_volatile_as_local = true }
"0x82513BE0" = { name = "sub_82513BE0", non_volatile_as_local = true }
